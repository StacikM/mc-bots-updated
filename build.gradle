plugins {
    id 'java'
}

group 'me.creepermaxcz.mc-bots'
version '1.2.17'

repositories {
    mavenCentral()
    maven {
        name = 'opencollab-releases'
        url = 'https://repo.opencollab.dev/maven-releases/'
    }
    maven {
        name = 'opencollab-snapshots'
        url = 'https://repo.opencollab.dev/maven-snapshots/'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // MCProtocolLib for 1.21.7 (works with 1.21.11)
    implementation 'org.geysermc.mcprotocollib:protocol:1.21.7-1'
    
    // Required dependencies
    implementation 'net.kyori:adventure-text-serializer-gson:4.17.0'
    implementation 'commons-cli:commons-cli:1.9.0'
    implementation 'com.diogonunes:JColor:5.5.1'
    implementation 'dnsjava:dnsjava:3.5.3'
    implementation 'org.slf4j:slf4j-nop:2.0.17'
    implementation 'org.jline:jline:3.30.4'
    
    // MinecraftAuth for online mode (already included as transitive dependency of mcprotocollib)
    // But we'll declare it explicitly to ensure version compatibility
    implementation 'net.raphimc:MinecraftAuth:4.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'me.creepermaxcz.mcbots.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.filter{ it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
    }
}